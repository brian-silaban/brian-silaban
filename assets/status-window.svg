<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="100%" height="100%">
  <defs>
    <!-- Main Outer Card Background -->
    <linearGradient id="bgCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12132e" />
      <stop offset="55%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#2e1a47" />
    </linearGradient>

    <!-- Inner Panel Background -->
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#141130" stop-opacity="0.95" />
    </linearGradient>

    <!-- Window Twilight Sky -->
    <linearGradient id="windowSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#17153b" />
      <stop offset="45%" stop-color="#433878" />
      <stop offset="80%" stop-color="#c874b2" />
      <stop offset="100%" stop-color="#f5b7b1" />
    </linearGradient>

    <!-- Pastel Border Gradient -->
    <linearGradient id="borderPastel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#f472b6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Skill Bar Gradients -->
    <linearGradient id="barCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>

    <linearGradient id="barPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>

    <linearGradient id="barGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>

    <filter id="glowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .hud-header {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 700;
      font-size: 16px;
      fill: #e0f2fe;
      letter-spacing: 1.5px;
    }
    .player-name {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 800;
      font-size: 24px;
      fill: #ffffff;
      letter-spacing: 0.5px;
    }
    .player-title {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #fbcfe8;
      letter-spacing: 0.8px;
    }
    .stat-label {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 700;
      font-size: 12px;
      fill: #c4b5fd;
      letter-spacing: 0.8px;
    }
    .stat-value {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 700;
      font-size: 16px;
      fill: #ffffff;
    }
    .section-title-pink {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 700;
      font-size: 13px;
      fill: #fbcfe8;
      letter-spacing: 1px;
    }
    .section-title-cyan {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 700;
      font-size: 13px;
      fill: #bae6fd;
      letter-spacing: 1px;
    }
    .quest-text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 500;
      font-size: 14.5px;
      fill: #f8fafc;
    }
    .skill-name {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 600;
      font-size: 14.5px;
      fill: #ffffff;
    }
    .skill-pct {
      font-family: 'Courier New', Consolas, monospace;
      font-weight: 700;
      font-size: 14.5px;
      fill: #fde68a;
    }
    .lofi-text {
      font-family: 'Courier New', Consolas, monospace;
      font-weight: 600;
      font-size: 12.5px;
      fill: #fde68a;
    }
    .badge-text-cyan {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #bae6fd;
    }
    .badge-text-pink {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #fbcfe8;
    }
    @keyframes steam {
      0% { transform: translateY(0px); opacity: 0.75; }
      50% { transform: translateY(-5px); opacity: 0.95; }
      100% { transform: translateY(-10px); opacity: 0; }
    }
    @keyframes eq1 {
      0%, 100% { height: 6px; y: 544px; }
      50% { height: 15px; y: 535px; }
    }
    @keyframes eq2 {
      0%, 100% { height: 14px; y: 536px; }
      50% { height: 5px; y: 545px; }
    }
    @keyframes eq3 {
      0%, 100% { height: 8px; y: 542px; }
      50% { height: 16px; y: 534px; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }
    .steam-1 { animation: steam 2.6s ease-in-out infinite; }
    .steam-2 { animation: steam 2.6s ease-in-out infinite 1.2s; }
    .eq-bar-1 { animation: eq1 1.1s ease-in-out infinite; }
    .eq-bar-2 { animation: eq2 0.9s ease-in-out infinite; }
    .eq-bar-3 { animation: eq3 1.3s ease-in-out infinite; }
    .status-dot { animation: blink 2.2s ease-in-out infinite; }
  </style>

  <!-- Outer Frame -->
  <rect x="2" y="2" width="976" height="616" rx="18" ry="18" fill="url(#bgCard)" stroke="url(#borderPastel)" stroke-width="2" />

  <!-- Corner Ornaments -->
  <path d="M 16 32 L 16 16 L 32 16" stroke="#7dd3fc" stroke-width="2" fill="none" stroke-linecap="round" />
  <path d="M 964 32 L 964 16 L 948 16" stroke="#fde68a" stroke-width="2" fill="none" stroke-linecap="round" />
  <path d="M 16 588 L 16 604 L 32 604" stroke="#f472b6" stroke-width="2" fill="none" stroke-linecap="round" />
  <path d="M 964 588 L 964 604 L 948 604" stroke="#7dd3fc" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- ===================================================== -->
  <!-- LEFT PANEL: COZY LO-FI TWILIGHT ROOM & CHARACTER CARD -->
  <!-- ===================================================== -->
  <g transform="translate(26, 26)">
    <rect x="0" y="0" width="284" height="568" rx="14" fill="url(#panelBg)" stroke="#4c1d95" stroke-width="1.5" />

    <!-- Cozy Room Window Scene -->
    <g transform="translate(24, 24)">
      <!-- Window Frame & Twilight Sky -->
      <rect x="0" y="0" width="236" height="270" rx="10" fill="url(#windowSky)" stroke="#6d28d9" stroke-width="2" />

      <!-- Stars & Crescent Moon in Window -->
      <circle cx="38" cy="42" r="1.4" fill="#ffffff" opacity="0.9" />
      <circle cx="88" cy="28" r="1.1" fill="#ffffff" opacity="0.7" />
      <circle cx="144" cy="50" r="1.5" fill="#ffffff" opacity="0.85" />
      <circle cx="198" cy="36" r="1.2" fill="#ffffff" opacity="0.75" />
      <path d="M 182 54 A 14 14 0 1 0 197 69 A 11.5 11.5 0 1 1 182 54 Z" fill="#fef08a" />

      <!-- Mini Shooting Star in Window -->
      <line x1="35" y1="88" x2="104" y2="122" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" opacity="0.85" />
      <circle cx="104" cy="122" r="2.5" fill="#ffffff" />

      <!-- Distant Soft Clouds in Window -->
      <path d="M 0 206 Q 38 184 76 198 Q 120 174 166 194 Q 202 180 236 198 L 236 270 L 0 270 Z" fill="#f472b6" opacity="0.32" />
      <path d="M 0 224 Q 48 204 98 218 Q 148 198 198 216 L 236 208 L 236 270 L 0 270 Z" fill="#311042" opacity="0.65" />

      <!-- Window Panes (Cross Mullions) -->
      <line x1="118" y1="0" x2="118" y2="244" stroke="#1e1b4b" stroke-width="3" />
      <line x1="0" y1="144" x2="236" y2="144" stroke="#1e1b4b" stroke-width="3" />

      <!-- Desk / Window Sill -->
      <rect x="-4" y="244" width="244" height="28" rx="4" fill="#171230" stroke="#4c1d95" stroke-width="1" />

      <!-- Glowing Laptop on Desk -->
      <g transform="translate(54, 194)">
        <rect x="0" y="0" width="86" height="50" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
        <text x="8" y="15" font-family="monospace" font-size="8" fill="#4ade80">brian@linux:~$</text>
        <rect x="8" y="21" width="46" height="3.2" rx="1.5" fill="#38bdf8" opacity="0.85" />
        <rect x="8" y="28" width="62" height="3.2" rx="1.5" fill="#f472b6" opacity="0.85" />
        <rect x="14" y="35" width="50" height="3.2" rx="1.5" fill="#fde047" opacity="0.85" />
        <rect x="8" y="42" width="30" height="3.2" rx="1.5" fill="#a78bfa" opacity="0.85" />
        <path d="M -8 50 L 94 50 L 88 55 L -2 55 Z" fill="#334155" />
      </g>

      <!-- Warm Coffee Mug with Animated Steam -->
      <g transform="translate(164, 222)">
        <path class="steam-1" d="M 8 -3 Q 4 -9 9 -14 Q 13 -19 8 -24" stroke="#fce7f3" stroke-width="1.6" fill="none" stroke-linecap="round" />
        <path class="steam-2" d="M 16 -2 Q 20 -8 15 -13 Q 11 -18 16 -23" stroke="#bae6fd" stroke-width="1.6" fill="none" stroke-linecap="round" />
        <rect x="2" y="0" width="21" height="22" rx="3" fill="#f472b6" />
        <rect x="4" y="3" width="17" height="3" rx="1" fill="#fce7f3" opacity="0.6" />
        <path d="M 23 4 Q 29 4 29 10.5 Q 29 17 23 17" stroke="#f472b6" stroke-width="2.5" fill="none" />
      </g>

      <!-- Small Cozy Potted Plant on Left -->
      <g transform="translate(16, 218)">
        <polygon points="4,12 20,12 17,26 7,26" fill="#e07a5f" />
        <path d="M 12 12 Q 4 2 2 8 Q 6 12 12 12 Z" fill="#34d399" />
        <path d="M 12 12 Q 12 -2 16 2 Q 16 9 12 12 Z" fill="#10b981" />
        <path d="M 12 12 Q 20 3 22 9 Q 17 12 12 12 Z" fill="#6ee7b7" />
      </g>
    </g>

    <!-- Character Identity Section -->
    <text x="142" y="346" text-anchor="middle" class="player-name">Brian Silaban</text>
    <text x="142" y="378" text-anchor="middle" class="player-title">✦ Twilight Code Weaver ✦</text>

    <!-- Divider -->
    <line x1="32" y1="408" x2="252" y2="408" stroke="#4c1d95" stroke-width="1.2" />

    <!-- Role Badges Inside Left Card -->
    <g transform="translate(24, 434)">
      <rect x="0" y="0" width="112" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="22" cy="18" r="4.2" fill="#38bdf8" />
      <text x="64" y="22.5" text-anchor="middle" class="badge-text-cyan">Backend</text>

      <rect x="124" y="0" width="112" height="36" rx="18" fill="#1e293b" stroke="#f472b6" stroke-width="1.2" />
      <circle cx="146" cy="18" r="4.2" fill="#f472b6" />
      <text x="188" y="22.5" text-anchor="middle" class="badge-text-pink">Flutter</text>
    </g>

    <!-- Lo-Fi Music Equalizer Bar -->
    <rect x="24" y="498" width="236" height="38" rx="8" fill="#0f0a24" opacity="0.75" />
    <text x="62" y="522" class="lofi-text">♪ Lo-Fi · Tasogare Beats</text>
  </g>

  <!-- Animated Equalizer Bars -->
  <rect class="eq-bar-1" x="62" y="544" width="3.2" height="6" rx="1" fill="#38bdf8" />
  <rect class="eq-bar-2" x="68" y="536" width="3.2" height="14" rx="1" fill="#f472b6" />
  <rect class="eq-bar-3" x="74" y="542" width="3.2" height="8" rx="1" fill="#fde047" />

  <!-- ===================================================== -->
  <!-- RIGHT PANEL: ANIME RPG STATUS WINDOW (SPACIOUS)       -->
  <!-- ===================================================== -->
  <g transform="translate(332, 26)">
    <rect x="0" y="0" width="622" height="568" rx="14" fill="url(#panelBg)" stroke="#4c1d95" stroke-width="1.5" />

    <!-- Top Status Window Bar -->
    <rect x="0" y="0" width="622" height="56" rx="14" fill="#251b54" />
    <text x="30" y="34" class="hud-header">『 STATUS WINDOW // ステータス 』</text>
    <circle class="status-dot" cx="496" cy="29" r="4.5" fill="#4ade80" filter="url(#glowSoft)" />
    <text x="508" y="33" font-family="monospace" font-weight="700" font-size="13" fill="#86efac">LV.99 ONLINE</text>

    <!-- Attribute Grid (4 Stat Boxes with Generous Height & Padding) -->
    <g transform="translate(30, 80)">
      <!-- Box 1: CLASS -->
      <rect x="0" y="0" width="270" height="68" rx="10" fill="#13112c" stroke="#4338ca" stroke-width="1.2" />
      <text x="20" y="26" class="stat-label">CLASS / ROLE</text>
      <text x="20" y="52" class="stat-value">Backend &amp; Mobile Dev</text>

      <!-- Box 2: REALM / OS -->
      <rect x="292" y="0" width="270" height="68" rx="10" fill="#13112c" stroke="#4338ca" stroke-width="1.2" />
      <text x="312" y="26" class="stat-label">HOME REALM (OS)</text>
      <text x="312" y="52" class="stat-value">GNU/Linux Environment</text>

      <!-- Box 3: CORE ARSENAL -->
      <rect x="0" y="86" width="270" height="68" rx="10" fill="#13112c" stroke="#4338ca" stroke-width="1.2" />
      <text x="20" y="112" class="stat-label">MAIN ARSENAL</text>
      <text x="20" y="138" class="stat-value">Python · Flutter · Dart</text>

      <!-- Box 4: DATA VAULT -->
      <rect x="292" y="86" width="270" height="68" rx="10" fill="#13112c" stroke="#4338ca" stroke-width="1.2" />
      <text x="312" y="112" class="stat-label">DATABASE</text>
      <text x="312" y="138" class="stat-value">PostgreSQL · MySQL</text>
    </g>

    <!-- Subtle Divider 1 -->
    <line x1="30" y1="258" x2="592" y2="258" stroke="#3b3578" stroke-width="1" opacity="0.7" />

    <!-- Active Quests / Character Lore (34px Line Height) -->
    <g transform="translate(30, 286)">
      <text x="2" y="0" class="section-title-pink">✦ ACTIVE QUESTS &amp; CHARACTER LORE</text>
      <text x="6" y="34" class="quest-text">▸ Membangun sistem backend &amp; database yang bersih, cepat, dan scalable.</text>
      <text x="6" y="68" class="quest-text">▸ Merakit aplikasi mobile multi-platform yang ekspresif dengan Flutter.</text>
    </g>

    <!-- Subtle Divider 2 -->
    <line x1="30" y1="380" x2="592" y2="380" stroke="#3b3578" stroke-width="1" opacity="0.7" />

    <!-- Skill Mastery Bars (48px Vertical Rhythm Between Skills + 30px Bottom Margin) -->
    <g transform="translate(30, 410)">
      <text x="2" y="0" class="section-title-cyan">✦ SKILL MASTERY &amp; ATTRIBUTES</text>

      <!-- Skill 1 -->
      <circle cx="8" cy="26" r="4.5" fill="#38bdf8" />
      <text x="22" y="31" class="skill-name">Backend &amp; Database (Python, PostgreSQL, MySQL)</text>
      <text x="560" y="31" text-anchor="end" class="skill-pct">92 / 100</text>
      <rect x="2" y="40" width="558" height="9" rx="4.5" fill="#0f172a" />
      <rect x="2" y="40" width="513" height="9" rx="4.5" fill="url(#barCyan)" />

      <!-- Skill 2 -->
      <circle cx="8" cy="74" r="4.5" fill="#f472b6" />
      <text x="22" y="79" class="skill-name">Mobile Development (Flutter, Cross-Platform UI)</text>
      <text x="560" y="79" text-anchor="end" class="skill-pct">88 / 100</text>
      <rect x="2" y="88" width="558" height="9" rx="4.5" fill="#0f172a" />
      <rect x="2" y="88" width="491" height="9" rx="4.5" fill="url(#barPink)" />

      <!-- Skill 3 -->
      <circle cx="8" cy="122" r="4.5" fill="#fde047" />
      <text x="22" y="127" class="skill-name">Linux Ecosystem, CLI &amp; Cozy Lo-Fi Focus</text>
      <text x="560" y="127" text-anchor="end" class="skill-pct">95 / 100</text>
      <rect x="2" y="136" width="558" height="9" rx="4.5" fill="#0f172a" />
      <rect x="2" y="136" width="530" height="9" rx="4.5" fill="url(#barGold)" />
    </g>
  </g>
</svg>
